<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天室</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="chat-container">
    <div id="chat-header">
      <div>
        <h2>💬 即時聊天室</h2>
        <p class="subtitle">目前房間：<span id="current-room">大廳</span></p>
      </div>
      <div class="quick-rooms">
        <label for="room-select">快速切換</label>
        <select id="room-select">
          <option value="大廳" selected>大廳</option>
          <option value="技術">技術</option>
          <option value="閒聊">閒聊</option>
        </select>
      </div>
    </div>

    <div id="room-controls">
      <input id="custom-room" autocomplete="off" placeholder="輸入房間名稱後加入或建立" />
      <button id="join-room-btn">加入 / 建立房間</button>
    </div>

    <ul id="messages"></ul>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="輸入訊息..." />
      <button>送出</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
