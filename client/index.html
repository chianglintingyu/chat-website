<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>💬 即時聊天室</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- 左側：房間列表＋建立 / 加入房間 -->
    <aside class="sidebar">
      <h2>房間列表</h2>
      <ul id="roomList" class="room-list"></ul>

      <hr />

      <div class="user-block">
        <label>暱稱：</label>
        <input id="usernameInput" type="text" placeholder="請輸入暱稱" />
      </div>

      <div class="room-block">
        <label>房間名稱：</label>
        <input id="roomNameInput" type="text" placeholder="請輸入房間名稱" />

        <label>房間密碼：</label>
        <input id="roomPasswordInput" type="password" placeholder="請輸入密碼（可留空）" />

        <button id="createRoomBtn">建立房間</button>
        <button id="joinRoomBtn">加入房間</button>
      </div>
    </aside>

    <!-- 右側：聊天室 -->
    <main class="chat">
      <header class="chat-header">
        <h2 id="currentRoomTitle">目前尚未加入任何房間</h2>
      </header>

      <section id="messages" class="messages"></section>

      <footer class="chat-input-area">
        <input
          id="messageInput"
          type="text"
          placeholder="輸入訊息後按 Enter 或傳送"
        />
        <input id="imageInput" type="file" accept="image/*" />
        <button id="sendBtn">傳送</button>
      </footer>
    </main>
  </div>

  <!-- Socket.io client -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
